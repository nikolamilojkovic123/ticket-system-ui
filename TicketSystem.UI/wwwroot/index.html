<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TicketSystem.UI</title>
    <base href="/" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    
    <link href="css/dashboard.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <link href="TicketSystem.UI.styles.css" rel="stylesheet" />

    <style>
        body {
            opacity: 0;
            transition: opacity 0.2s ease-in;
        }
        body.loaded {
            opacity: 1;
        }
    </style>
    <script>
        window.themeInterop = {
            setTheme: function (theme) {
                document.documentElement.setAttribute('data-bs-theme', theme);
            }
        };

        (function () {
            try {
                var raw = localStorage.getItem('Theme');
                var theme = raw ? JSON.parse(raw) : 'light';
                window.themeInterop.setTheme(theme || 'light');
            } catch (e) {
                window.themeInterop.setTheme('light');
            }
        })();
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text">Učitavanje sistema...</div>
    </div>

    <div id="blazor-error-ui">
        Došlo je do neočekivane greške.
        <a href="." class="reload">Osveži stranicu</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module"></script>
    <script src="_framework/blazor.webassembly.js"></script>

    <script>
        window.blazorCulture = {
            get: () => localStorage.getItem('blazorCulture'),
            set: (value) => localStorage.setItem('blazorCulture', value)
        };
    </script>
</body>

</html>
